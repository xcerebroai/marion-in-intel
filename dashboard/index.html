<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marion County IN Distress Intelligence</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Marion County IN Distress Intelligence</h1>
      <span class="brand-sub">Operator lead board · private artifact</span>
    </div>
    <div class="topstats" id="topStats"></div>
    <div class="topactions">
      <button id="exportFiltered" class="btn">Export filtered CSV</button>
      <button id="exportMarked" class="btn btn-mark">Export marked — <span id="markedCount">0</span></button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>
  <div class="filterbar" id="filterSummary">Showing: <b>all leads</b> — sorted by urgency</div>

  <main>
    <aside class="sidebar">
      <section class="side-block">
        <h2>Quick views</h2>
        <div class="presets" id="presets"></div>
      </section>
      <section class="side-block">
        <h2>Search</h2>
        <input type="text" id="search" placeholder="owner, address, parcel…">
      </section>
      <section class="side-block">
        <h2>Filed within</h2>
        <select id="filedWindow">
          <option value="any">Any date</option>
          <option value="7">Last 7 days</option>
          <option value="14">Last 14 days</option>
          <option value="30">Last 30 days</option>
          <option value="90">Last 90 days</option>
        </select>
      </section>
      <section class="side-block">
        <h2>Assessed value</h2>
        <div class="range-row">
          <input type="number" id="valMin" placeholder="min $" min="0" step="10000">
          <span>–</span>
          <input type="number" id="valMax" placeholder="max $" min="0" step="10000">
        </div>
      </section>
      <section class="side-block">
        <h2>Distress pattern</h2>
        <div class="checkgroup" id="patternFilter"></div>
      </section>
      <section class="side-block">
        <h2>Owner type</h2>
        <div class="checkgroup" id="ownerFilter"></div>
      </section>
      <section class="side-block">
        <h2>Flags</h2>
        <label class="chk"><input type="checkbox" id="togNew"> New today only</label>
        <label class="chk"><input type="checkbox" id="togAbsentee"> Absentee owner only</label>
        <label class="chk"><input type="checkbox" id="togEnriched"> Enriched only</label>
        <label class="chk"><input type="checkbox" id="togReview"> Review-required only</label>
      </section>
      <button id="resetBtn" class="btn btn-block">Reset all filters</button>
    </aside>

    <section class="results">
      <div class="results-head">
        <span class="rowcount" id="rowCount"></span>
        <label class="sort-ctl">Sort
          <select id="sortMode">
            <option value="urgency">Urgency (default)</option>
            <option value="recent">Recently filed</option>
            <option value="value">Assessed value ↓</option>
            <option value="signals">Signal depth ↓</option>
          </select>
        </label>
        <span class="legend">
          <span class="lg lg-r"></span>Foreclosure
          <span class="lg lg-g"></span>Estate/Probate
          <span class="lg lg-y"></span>Tax Delinquent
          <span class="lg lg-b"></span>Bankruptcy
          <span class="lg lg-v"></span>Review Required
        </span>
      </div>
      <div class="leadlist" id="leadList"></div>
      <div class="empty" id="emptyMsg" hidden></div>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
