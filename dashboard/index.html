<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Distress Intelligence</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body data-ready="0" data-mode="loading">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-lockup">
          <span class="brand-icon">⚡</span>
          <div>
            <div class="brand-title" id="brand-title">Distress Intelligence</div>
            <div class="brand-subtitle" id="brand-subtitle">Real estate distress signals · Marion County, IN</div>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="meta-chip chip-build" id="build-label">FULL_BUILD</span>
        <span class="meta-chip chip-time" id="generated-at">—</span>
        <button class="meta-chip chip-mode" id="view-mode-pill" title="Toggle operator view">CLIENT VIEW</button>
      </div>
    </div>
  </header>

  <section class="status-banner" id="status-banner" hidden></section>

  <div class="app-shell">
    <aside class="sidebar" id="filter-rail">

      <div class="sidebar-section">
        <div class="sidebar-label">Pattern</div>
        <div class="chip-group" id="chips-pattern" data-axis="pattern"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Attribute</div>
        <div class="chip-group" id="chips-attribute" data-axis="attribute"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Deal Path</div>
        <div class="chip-group" id="chips-deal-path" data-axis="deal_path"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Stack Depth</div>
        <div class="chip-group" id="chips-stack-depth" data-axis="stack_depth"></div>
      </div>

      <div class="sidebar-actions">
        <button id="reset-filters" class="btn-ghost">↺ Reset</button>
        <button id="toggle-view-mode" class="btn-ghost operator-toggle">⚙ Operator View</button>
        <button id="csv-export" class="btn-primary" data-testid="csv-export">↓ Export CSV</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="stat-row" id="stat-tiles" role="status"></div>

      <div class="view-tabs" id="precanned-views"></div>

      <div class="table-card" id="table-wrap">
        <table class="leads-table" id="leads-table" aria-label="Distress leads">
          <thead>
            <tr>
              <th data-sort="primary_event_date">New</th>
              <th data-sort="display_address">Address</th>
              <th data-sort="display_owner">Owner</th>
              <th>Signals</th>
              <th>Deal Paths</th>
              <th data-sort="stack_depth">Stack</th>
              <th data-sort="display_assessed_value">Assessed</th>
              <th data-sort="primary_event_date">Event Date</th>
              <th class="operator-only" data-sort="display_last_sale_price">Last Sale</th>
              <th class="operator-only">Flags</th>
              <th>Source</th>
            </tr>
          </thead>
          <tbody id="leads-tbody"></tbody>
        </table>
        <div class="empty-state" id="empty-state" hidden>
          <div class="empty-icon">🔍</div>
          <div class="empty-title">No leads match</div>
          <div class="empty-sub">Try removing a filter or resetting all</div>
        </div>
      </div>
    </main>
  </div>

  <footer class="footer">
    <span id="footer-counts">—</span>
    <span class="footer-spacer"></span>
    <a class="footer-link" id="repo-link" href="#" target="_blank" rel="noopener" hidden>↗ repo</a>
  </footer>

  <script src="dashboard.js" defer></script>
</body>
</html>
